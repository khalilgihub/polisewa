<!DOCTYPE html>
<html>

<head>
    <title>Polisewa Map Search</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Boundary GeoJSON Data -->
    <script src="boundary.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div id="map-wrapper">
        <!-- Floating Search Box -->
        <div id="search-box">
            <div class="search-input-wrapper">
                <input type="text" id="search-input" placeholder="Search places (e.g. Kuching Waterfront)" />
                <button id="search-button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <!-- Dynamic dropdown results -->
            <div id="search-results"></div>
        </div>

        <!-- Floating Auth Button -->
        <button id="auth-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Login / Sign Up</span>
        </button>

        <!-- Auth Dropdown Menu (visible when logged in) -->
        <div id="auth-dropdown" class="auth-dropdown">
            <div class="auth-dropdown-header">Account</div>
            <button class="auth-dropdown-item" onclick="handleLogout()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Log Out
            </button>
            <div class="auth-dropdown-divider"></div>
            <button class="auth-dropdown-item auth-dropdown-danger" onclick="openDeleteAccountModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Delete Account
            </button>
        </div>

        <!-- Auth Modal Overlay -->
        <div id="auth-modal-overlay" class="modal-overlay">
            <div id="auth-modal" class="modal-card">
                <!-- Close Button -->
                <button class="close-btn" onclick="closeAuthModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <!-- Header -->
                <div class="modal-header">
                    <h2>Welcome to Polisewa</h2>
                    <p>Find room rentals or list your property near Politeknik</p>
                </div>

                <!-- Role Selector Tabs -->
                <div class="role-selector">
                    <button class="role-tab active" onclick="setRole('student')">🎓 Student</button>
                    <button class="role-tab" onclick="setRole('landlord')">🔑 Landlord</button>
                </div>

                <!-- Form Type Toggle (Sign In / Sign Up) -->
                <div class="form-toggle">
                    <button class="toggle-tab active" onclick="setFormType('signin')">Sign In</button>
                    <button class="toggle-tab" onclick="setFormType('signup')">Sign Up</button>
                </div>

                <!-- Sign In Form -->
                <form id="signin-form" class="auth-form active" onsubmit="handleAuthSubmit(event, 'signin')">
                    <div class="input-group">
                        <label for="signin-email">Email Address</label>
                        <input type="email" id="signin-email" required placeholder="name@student.edu.my" />
                    </div>
                    <div class="input-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" required placeholder="••••••••" />
                    </div>
                    <button type="submit" class="submit-btn">Sign In</button>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" class="auth-form" onsubmit="handleAuthSubmit(event, 'signup')">
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" required placeholder="John Doe" />
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" required placeholder="john@example.com" />
                    </div>
                    <div class="input-group">
                        <label for="signup-phone">Phone Number</label>
                        <input type="tel" id="signup-phone" required placeholder="+60123456789" />
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required placeholder="••••••••" />
                    </div>
                    <!-- Extra field for Student / Landlord details dynamically adjusted -->
                    <div class="input-group" id="extra-field-group">
                        <label id="extra-field-label" for="signup-extra">University / Institution</label>
                        <input type="text" id="signup-extra" placeholder="Politeknik Kuching Sarawak" />
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>
            </div>
        </div>

        <!-- Delete Account Confirmation Modal -->
        <div id="delete-modal-overlay" class="modal-overlay">
            <div id="delete-modal" class="modal-card modal-card-sm">
                <button class="close-btn" onclick="closeDeleteAccountModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="modal-header">
                    <h2>Delete Account</h2>
                    <p>This action is permanent and cannot be undone. All your properties will be removed.</p>
                </div>
                <div class="input-group">
                    <label for="delete-password">Enter your password to confirm</label>
                    <input type="password" id="delete-password" required placeholder="••••••••" />
                </div>
                <div class="modal-actions-row">
                    <button type="button" class="submit-btn submit-btn-secondary" onclick="closeDeleteAccountModal()">Cancel</button>
                    <button type="button" class="submit-btn submit-btn-danger" id="delete-confirm-btn" onclick="handleDeleteAccount()">Delete Forever</button>
                </div>
            </div>
        </div>

        <!-- The Map -->
        <div id="map"></div>
    </div>

    <!-- Left Property Sidebar Panel (landlord create/edit) -->
    <div id="property-panel" class="property-panel">
        <div class="property-panel-header">
            <button class="panel-back-btn" onclick="closePropertyPanel()" title="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div class="property-panel-title">
                <h3 id="panel-title-text">Add Property</h3>
                <p id="panel-coords" class="panel-coords"></p>
            </div>
        </div>
        <form id="property-panel-form" onsubmit="savePropertyFromPanel(event)">
            <div class="input-group">
                <label for="panel-name">Name</label>
                <input type="text" id="panel-name" required placeholder="Cozy Room near PKS" />
            </div>
            <div class="input-group">
                <label for="panel-desc">Description</label>
                <textarea id="panel-desc" rows="3" placeholder="Single room, furnished, WiFi included"></textarea>
            </div>
            <div class="input-group">
                <label for="panel-price">Monthly Rent (RM)</label>
                <input type="number" id="panel-price" placeholder="350" min="0" />
            </div>
            <div class="input-group">
                <label for="panel-phone">Phone</label>
                <input type="tel" id="panel-phone" placeholder="+60123456789" />
            </div>
            <div class="input-group" id="panel-image-group">
                <label id="panel-image-label">Property Photos (Up to 5)</label>
                <!-- Multi-file input for Landlord Uploads -->
                <input type="file" id="panel-image-input" accept="image/*" multiple hidden onchange="handleImageSelection(event)" />
                
                <!-- Landlord Multiple Image Container Grid (Edit/Create mode) -->
                <div id="panel-image-edit-container" style="display:none; width: 100%;">
                    <div class="panel-image-grid" id="panel-image-grid"></div>
                </div>

                <!-- User/Student Photo Gallery Viewer (View mode) -->
                <div id="panel-image-view-container" style="display:none; width: 100%;">
                    <div id="panel-gallery-view"></div>
                </div>
            </div>
            <div id="panel-landlord-info" class="panel-landlord-info"></div>
            <div class="panel-actions" id="panel-actions-edit">
                <button type="button" class="panel-btn-secondary" id="panel-delete-btn" onclick="deletePropertyFromPanel()" style="display:none; background:#fee2e2; color:#ef4444; border:1px solid #fca5a5;">Delete Pinpoint</button>
                <button type="button" class="panel-btn-secondary" id="panel-cancel-btn" onclick="closePropertyPanel()">Cancel</button>
                <button type="submit" class="panel-btn-primary" id="panel-save-btn">Add Property</button>
            </div>
            <div class="panel-actions" id="panel-actions-view" style="display:none;">
                <button type="button" class="panel-btn-primary" onclick="closePropertyPanel()">Close</button>
            </div>
        </form>
    </div>

    <script>
        // Define geographic bounds for Kuching region (Lat 1.15..1.85, Lng 109.80..110.70)
        var kuchingMaxBounds = L.latLngBounds(
            L.latLng(1.15, 109.80),
            L.latLng(1.85, 110.70)
        );

        // 1. Initialize Leaflet Map centered on Kuching with strict boundary enforcement
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            maxBounds: kuchingMaxBounds,
            maxBoundsViscosity: 1.0, // Prevents panning outside Kuching area
            minZoom: 11,              // Prevents zooming out past Kuching region
            maxZoom: 19
        }).setView([1.5535, 110.3593], 13);

        // 2. Add Base Map Tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. Draw the Kuching boundary from the boundary.js file (bypasses browser CORS blocks on local file:// files)
        if (typeof kuchingBoundary !== 'undefined') {
            L.geoJSON(kuchingBoundary, {
                style: {
                    color: '#ff6600',    // Orange color
                    dashArray: '8, 8',   // Dotted line style
                    weight: 3.5,
                    fillOpacity: 0       // Transparent fill (outline only)
                },
                interactive: false       // Let clicks pass through to the map
            }).addTo(map);
        } else {
            console.error("kuchingBoundary variable is not defined.");
        }

        // Stitch multi-segment boundary lines into closed polygon rings
        var kuchingPolygonRings = [];
        if (typeof kuchingBoundary !== 'undefined' && kuchingBoundary.geometry && kuchingBoundary.geometry.coordinates) {
            var segments = JSON.parse(JSON.stringify(kuchingBoundary.geometry.coordinates));
            function ptEq(p1, p2) { return Math.abs(p1[0]-p2[0]) < 1e-6 && Math.abs(p1[1]-p2[1]) < 1e-6; }
            while (segments.length > 0) {
                var currentRing = segments.shift();
                var grew = true;
                while (grew) {
                    grew = false;
                    var start = currentRing[0];
                    var end = currentRing[currentRing.length - 1];
                    for (var i = 0; i < segments.length; i++) {
                        var seg = segments[i];
                        if (ptEq(end, seg[0])) {
                            currentRing.push.apply(currentRing, seg.slice(1));
                            segments.splice(i, 1);
                            grew = true; break;
                        } else if (ptEq(end, seg[seg.length - 1])) {
                            currentRing.push.apply(currentRing, seg.slice(0, -1).reverse());
                            segments.splice(i, 1);
                            grew = true; break;
                        } else if (ptEq(start, seg[seg.length - 1])) {
                            currentRing.unshift.apply(currentRing, seg.slice(0, -1));
                            segments.splice(i, 1);
                            grew = true; break;
                        } else if (ptEq(start, seg[0])) {
                            currentRing.unshift.apply(currentRing, seg.slice(1).reverse());
                            segments.splice(i, 1);
                            grew = true; break;
                        }
                    }
                }
                kuchingPolygonRings.push(currentRing);
            }
        }

        // Ray-casting point-in-polygon check against the exact orange Kuching boundary line
        function isInsideKuchingBoundary(lat, lng) {
            if (!kuchingMaxBounds.contains([lat, lng])) return false;
            if (kuchingPolygonRings.length === 0) return true;

            var isInside = false;
            for (var r = 0; r < kuchingPolygonRings.length; r++) {
                var ring = kuchingPolygonRings[r];
                for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    var xi = ring[i][0], yi = ring[i][1];
                    var xj = ring[j][0], yj = ring[j][1];
                    var intersect = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                    if (intersect) isInside = !isInside;
                }
            }
            return isInside;
        }



        // 5. Special Pinpoint: Politeknik Kuching Sarawak (Normal Marker with graduation cap icon)
        var polytechnicLatLng = [1.630688, 110.193062];
        var polytechIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="marker-pin"></div><span>🎓</span>',
            iconSize: [30, 30],
            iconAnchor: [15, 30],
            popupAnchor: [0, -30]
        });
        var polytechMarker = L.marker(polytechnicLatLng, { icon: polytechIcon }).addTo(map);
        polytechMarker.bindPopup("<b>Politeknik Kuching Sarawak (PKS)</b><br>Batu 8, Jalan Matang");

        // Zoom in when clicking Politeknik Kuching
        polytechMarker.on('click', function (e) {
            map.setView(e.latlng, 16);
        });

        var currentMarker = null;
        var currentUser = null;
        var landlordMarkers = [];
        var editingMarkerIndex = -1;
        var pendingImages = []; // Array of { url: string, file: File | null }

        // Utility to parse single image string, JSON array, or comma-separated string
        function parseImageUrls(imageVal) {
            if (!imageVal) return [];
            if (Array.isArray(imageVal)) return imageVal.filter(Boolean);
            if (typeof imageVal === 'string') {
                var trimmed = imageVal.trim();
                if (trimmed.startsWith('[')) {
                    try {
                        var parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) return parsed.filter(Boolean);
                    } catch (e) {}
                }
                if (trimmed.includes(',')) {
                    return trimmed.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
                }
                return [trimmed];
            }
            return [];
        }

        // Build HTML for Photo Gallery Carousel (used in Map Popups & View Panel)
        function buildGalleryHtml(imageUrls, galleryId, isPopup) {
            if (!imageUrls || imageUrls.length === 0) {
                return '<div class="property-gallery-container ' + (isPopup ? 'popup-gallery-container' : '') + '" style="background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;font-weight:500;">' +
                    '<div style="text-align:center;">📷<br>No photos uploaded</div>' +
                    '</div>';
            }
            if (imageUrls.length === 1) {
                return '<div class="property-gallery-container ' + (isPopup ? 'popup-gallery-container' : '') + '">' +
                    '<img class="gallery-slide-img" src="' + imageUrls[0] + '" alt="Property photo" />' +
                    '</div>';
            }

            var escapedUrls = JSON.stringify(imageUrls).replace(/"/g, '&quot;');
            var dotsHtml = '';
            for (var i = 0; i < imageUrls.length; i++) {
                dotsHtml += '<span class="gallery-dot ' + (i === 0 ? 'active' : '') + '" onclick="event.stopPropagation(); window.setGallerySlide(\'' + galleryId + '\', ' + i + ', ' + imageUrls.length + ')"></span>';
            }

            return '<div id="' + galleryId + '" class="property-gallery-container ' + (isPopup ? 'popup-gallery-container' : '') + '" data-index="0" data-urls="' + escapedUrls + '">' +
                '<img class="gallery-slide-img" src="' + imageUrls[0] + '" alt="Property photo 1" />' +
                '<button type="button" class="gallery-nav-btn prev" onclick="event.stopPropagation(); window.cycleGallery(\'' + galleryId + '\', -1, ' + imageUrls.length + ')" title="Previous photo">❮</button>' +
                '<button type="button" class="gallery-nav-btn next" onclick="event.stopPropagation(); window.cycleGallery(\'' + galleryId + '\', 1, ' + imageUrls.length + ')" title="Next photo">❯</button>' +
                '<span class="gallery-counter">1 / ' + imageUrls.length + '</span>' +
                '<div class="gallery-dots">' + dotsHtml + '</div>' +
                '</div>';
        }

        // Global carousel controls
        window.cycleGallery = function(galleryId, delta, total) {
            var container = document.getElementById(galleryId);
            if (!container) return;
            var currentIdx = parseInt(container.getAttribute('data-index') || '0', 10);
            var newIdx = (currentIdx + delta + total) % total;
            window.setGallerySlide(galleryId, newIdx, total);
        };

        window.setGallerySlide = function(galleryId, targetIndex, total) {
            var container = document.getElementById(galleryId);
            if (!container) return;
            var urlsStr = container.getAttribute('data-urls') || '[]';
            var urls = [];
            try { urls = JSON.parse(urlsStr); } catch (e) {}

            container.setAttribute('data-index', targetIndex);
            var img = container.querySelector('.gallery-slide-img');
            if (img && urls[targetIndex]) {
                img.style.opacity = '0.4';
                setTimeout(function() {
                    img.src = urls[targetIndex];
                    img.style.opacity = '1';
                }, 100);
            }
            var counter = container.querySelector('.gallery-counter');
            if (counter) {
                counter.innerText = (targetIndex + 1) + ' / ' + total;
            }
            var dots = container.querySelectorAll('.gallery-dot');
            for (var i = 0; i < dots.length; i++) {
                if (i === targetIndex) dots[i].classList.add('active');
                else dots[i].classList.remove('active');
            }
        };

        // Render Landlord Multi-Picture Container Grid or User Gallery Viewer in Property Panel
        function renderPanelImages(mode) {
            var editContainer = document.getElementById('panel-image-edit-container');
            var viewContainer = document.getElementById('panel-image-view-container');
            var grid = document.getElementById('panel-image-grid');
            var galleryView = document.getElementById('panel-gallery-view');
            var label = document.getElementById('panel-image-label');

            if (mode === 'create' || mode === 'edit') {
                label.innerText = 'Property Photos (' + pendingImages.length + ' / 5)';
                editContainer.style.display = 'block';
                viewContainer.style.display = 'none';

                var gridHtml = '';
                for (var i = 0; i < pendingImages.length; i++) {
                    var item = pendingImages[i];
                    gridHtml += '<div class="panel-image-card ' + (i === 0 ? 'is-cover' : '') + '">' +
                        '<img src="' + item.url + '" alt="Property photo ' + (i + 1) + '" />' +
                        (i === 0 ? '<span class="cover-badge">Cover</span>' : '') +
                        '<button type="button" class="remove-btn" onclick="removePendingImage(' + i + ')" title="Remove photo">✕</button>' +
                        '</div>';
                }
                if (pendingImages.length < 5) {
                    gridHtml += '<div class="panel-add-card" onclick="document.getElementById(\'panel-image-input\').click()">' +
                        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
                        '<span>Add Photo</span>' +
                        '</div>';
                }
                grid.innerHTML = gridHtml;
            } else { // 'view' mode
                label.innerText = 'Property Photos';
                editContainer.style.display = 'none';
                viewContainer.style.display = 'block';
                var urls = pendingImages.map(function(item) { return item.url; });
                galleryView.innerHTML = buildGalleryHtml(urls, 'panel-view-gallery', false);
            }
        }

        function handleImageSelection(event) {
            var files = event.target.files;
            if (!files || files.length === 0) return;
            var maxAllowed = 5 - pendingImages.length;
            if (maxAllowed <= 0) {
                alert('Maximum 5 photos allowed per property.');
                event.target.value = '';
                return;
            }

            var countToAdd = Math.min(files.length, maxAllowed);
            for (var i = 0; i < countToAdd; i++) {
                var file = files[i];
                var tempUrl = URL.createObjectURL(file);
                pendingImages.push({ url: tempUrl, file: file });
            }
            event.target.value = '';
            renderPanelImages(panelMode);
        }

        function removePendingImage(index) {
            pendingImages.splice(index, 1);
            renderPanelImages(panelMode);
        }

        function loadProperties() {
            fetch('/api/properties')
                .then(function(res) { return res.json(); })
                .then(function(properties) {
                    for (var i = 0; i < landlordMarkers.length; i++) {
                        map.removeLayer(landlordMarkers[i].marker);
                    }
                    landlordMarkers = [];

                    for (var j = 0; j < properties.length; j++) {
                        var prop = properties[j];
                        var marker = L.marker([prop.lat, prop.lng]).addTo(map);
                        var propertyData = {
                            id: prop.id,
                            user_id: prop.user_id,
                            marker: marker,
                            name: prop.name,
                            desc: prop.desc,
                            price: prop.price,
                            phone: prop.phone,
                            landlord_name: prop.landlord_name,
                            lat: prop.lat,
                            lng: prop.lng,
                            image: prop.image || ''
                        };
                        var index = landlordMarkers.length;
                        landlordMarkers.push(propertyData);
                        marker.bindPopup(createMarkerPopup(index));
                        marker.on('click', (function(idx) {
                            return function() {
                                var data = landlordMarkers[idx];
                                var isOwner = currentUser && currentUser.id === data.user_id;
                                if (isOwner) {
                                    map.closePopup();
                                    openPropertyPanel('edit', idx);
                                } else {
                                    map.closePopup();
                                    openPropertyPanel('view', idx);
                                }
                            };
                        })(index));
                    }
                })
                .catch(function(err) {
                    console.error('Failed to load properties:', err);
                });
        }

        loadProperties();

        function rebuildAllPopups() {
            for (var i = 0; i < landlordMarkers.length; i++) {
                landlordMarkers[i].marker.unbindPopup();
                landlordMarkers[i].marker.bindPopup(createMarkerPopup(i));
                landlordMarkers[i].marker.off('click');
                landlordMarkers[i].marker.on('click', (function(idx) {
                    return function() {
                        var data = landlordMarkers[idx];
                        var isOwner = currentUser && currentUser.id === data.user_id;
                        if (isOwner) {
                            map.closePopup();
                            openPropertyPanel('edit', idx);
                        } else {
                            map.closePopup();
                            openPropertyPanel('view', idx);
                        }
                    };
                })(i));
            }
        }

            popupContent.innerHTML = imageHtml +
                "<b>" + data.name + "</b>" +

                (data.price ? "<br><span style='color:#2563eb;font-weight:600;'>RM " + data.price + "/month</span>" : "") +

        function savePropertyFromPanel(event) {
            event.preventDefault();

            var name = document.getElementById('panel-name').value.trim();
            var desc = document.getElementById('panel-desc').value.trim();
            var price = document.getElementById('panel-price').value.trim();
            var phone = document.getElementById('panel-phone').value.trim();
            var saveBtn = document.getElementById('panel-save-btn');
            var originalText = saveBtn.innerText;
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            var newFiles = pendingImages.filter(function(item) { return item.file !== null; });

            var savePropertyWithFinalUrls = function(finalImageUrls) {
                var finalImageStr = JSON.stringify(finalImageUrls);

                if (panelMode === 'create') {
                    fetch('/api/properties', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: currentUser.id,
                            name: name,
                            desc: desc,
                            price: price,
                            phone: phone,
                            lat: pendingLatLng.lat,
                            lng: pendingLatLng.lng,
                            image: finalImageStr
                        })
                    })
                    .then(function(res) { return res.json(); })
                    .then(function(result) {
                        if (result.error) {
                            alert(result.error);
                            saveBtn.disabled = false;
                            saveBtn.innerText = originalText;
                            return;
                        }
                        var newMarker = L.marker([pendingLatLng.lat, pendingLatLng.lng]).addTo(map);
                        var propertyData = {
                            id: result.id,
                            user_id: currentUser.id,
                            marker: newMarker,
                            name: name,
                            desc: desc,
                            price: price,
                            phone: phone,
                            landlord_name: currentUser.name,
                            lat: pendingLatLng.lat,
                            lng: pendingLatLng.lng,
                            image: finalImageStr
                        };
                        var index = landlordMarkers.length;
                        landlordMarkers.push(propertyData);
                        newMarker.bindPopup(createMarkerPopup(index));
                        newMarker.on('click', (function(idx) {
                            return function() {
                                var data = landlordMarkers[idx];
                                if (currentUser && currentUser.id === data.user_id) {
                                    map.closePopup();
                                    openPropertyPanel('edit', idx);
                                } else {
                                    map.closePopup();
                                    openPropertyPanel('view', idx);
                                }
                            };
                        })(index));
                        newMarker.openPopup();
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                        closePropertyPanel();
                    })
                    .catch(function(err) {
                        alert('Failed to create property: ' + err.message);
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                    });
                } else if (panelMode === 'edit') {
                    if (editingMarkerIndex < 0) {
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                        return;
                    }

                    var data = landlordMarkers[editingMarkerIndex];
                    data.name = name;
                    data.desc = desc;
                    data.price = price;
                    data.phone = phone;
                    data.image = finalImageStr;

                    fetch('/api/properties/' + data.id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: currentUser.id,
                            name: name,
                            desc: desc,
                            price: price,
                            phone: phone,
                            image: finalImageStr
                        })
                    })
                    .then(function(res) { return res.json(); })
                    .then(function() {
                        refreshPopup(editingMarkerIndex);
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                        closePropertyPanel();
                    })
                    .catch(function(err) {
                        alert('Failed to save property: ' + err.message);
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                    });
                }
            };

            if (newFiles.length > 0) {
                var formData = new FormData();
                newFiles.forEach(function(item) {
                    formData.append('images', item.file);
                });
                fetch('/api/properties/upload-images', {
                    method: 'POST',
                    body: formData
                })
                .then(function(res) { return res.json(); })
                .then(function(uploadResult) {
                    if (uploadResult.error) {
                        alert('Image upload failed: ' + uploadResult.error);
                        saveBtn.disabled = false;
                        saveBtn.innerText = originalText;
                        return;
                    }
                    var uploadedUrls = uploadResult.imageUrls || [];
                    var uploadedIdx = 0;
                    var finalUrls = pendingImages.map(function(item) {
                        if (item.file !== null && uploadedUrls[uploadedIdx]) {
                            return uploadedUrls[uploadedIdx++];
                        }
                        return item.url;
                    });
                    savePropertyWithFinalUrls(finalUrls);
                })
                .catch(function(err) {
                    alert('Image upload failed: ' + err.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = originalText;
                });
            } else {
                var finalUrls = pendingImages.map(function(item) { return item.url; });
                savePropertyWithFinalUrls(finalUrls);
            }
        }

        // 3. Geocoding Search Function (Strictly localized to Kuching, Sarawak)
        function performSearch() {
            var query = document.getElementById("search-input").value.trim();
            if (!query) return;

            var resultsContainer = document.getElementById("search-results");
            resultsContainer.innerHTML = '<div style="padding: 12px 16px; color: #64748b; font-size: 14px;">Searching in Kuching...</div>';
            resultsContainer.style.display = 'block';

            // Ensure query contains 'Kuching' to bias search results locally
            var queryFormatted = query;
            if (!queryFormatted.toLowerCase().includes('kuching')) {
                queryFormatted += ', Kuching, Sarawak';
            }

            // Query Nominatim API with countrycodes=my, viewbox for Kuching, and bounded=1
            var url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(queryFormatted) +
                '&countrycodes=my&viewbox=109.80,1.85,110.70,1.15&bounded=1&limit=5';

            fetch(url)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    resultsContainer.innerHTML = '';

                    // Filter results to ensure they stay strictly within orange Kuching boundary
                    var localResults = data.filter(function (item) {
                        var lat = parseFloat(item.lat);
                        var lon = parseFloat(item.lon);
                        return isInsideKuchingBoundary(lat, lon);
                    });

                    if (localResults.length === 0) {
                        resultsContainer.innerHTML = '<div style="padding: 12px 16px; color: #ef4444; font-size: 14px;">No locations found in Kuching. Try another keyword like "Matang", "Satok", or "Politeknik".</div>';
                        return;
                    }

                    // Loop through results and build dropdown list
                    localResults.forEach(function (item) {
                        var div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerText = item.display_name;

                        div.onclick = function () {
                            var lat = parseFloat(item.lat);
                            var lon = parseFloat(item.lon);

                            // Zoom & center map on result coordinates
                            map.setView([lat, lon], 16);

                            // Remove old search marker
                            if (currentMarker) {
                                map.removeLayer(currentMarker);
                            }

                            // Place new marker with popup
                            currentMarker = L.marker([lat, lon]).addTo(map);
                            var nameOnly = item.display_name.split(',')[0];
                            currentMarker.bindPopup("<b>" + nameOnly + "</b><br>" + item.display_name).openPopup();

                            // Zoom in when clicking the search marker
                            currentMarker.on('click', function (e) {
                                map.setView(e.latlng, 16);
                            });

                            // Clear search input text and close dropdown
                            resultsContainer.style.display = 'none';
                            document.getElementById("search-input").value = nameOnly;
                        };
                        resultsContainer.appendChild(div);
                    });
                })
                .catch(function (error) {
                    console.error('Search error:', error);
                    resultsContainer.innerHTML = '<div style="padding: 12px 16px; color: #ef4444; font-size: 14px;">Error fetching search results.</div>';
                });
        }

        function handleAuthSubmit(event, type) {
            event.preventDefault();

            var payload = {};
            var url = "";

            if (type === 'signin') {
                payload = {
                    email: document.getElementById("signin-email").value.trim(),
                    password: document.getElementById("signin-password").value
                };
                url = "/api/signin";
            } else {
                payload = {
                    name: document.getElementById("signup-name").value.trim(),
                    email: document.getElementById("signup-email").value.trim(),
                    phone: document.getElementById("signup-phone").value.trim(),
                    password: document.getElementById("signup-password").value,
                    role: activeRole,
                    extra: document.getElementById("signup-extra").value.trim()
                };
                url = "/api/signup";
            }

            // Visual loading state on the submit button
            var submitBtn = event.target.querySelector(".submit-btn");
            var originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = "Please wait...";

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
                .then(function (response) {
                    return response.json().then(function (data) {
                        if (!response.ok) {
                            throw new Error(data.error || "An error occurred.");
                        }
                        return data;
                    });
                })
                .then(function (data) {
                    alert(data.message);
                    closeAuthModal();
                    event.target.reset();

                    // Save user session and update button
                    if (data.user) {
                        currentUser = data.user;
                        localStorage.setItem('polisewa_user', JSON.stringify(data.user));
                        updateAuthButton();
                        loadProperties();
                    }
                })
                .catch(function (error) {
                    alert("Error: " + error.message);
                })
                .finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalText;
                });
        }
    </script>
</body>

</html>
